<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Connect Demel</title>
    <style>
      :root { color-scheme: dark; --bg: #121214; --surface: #1b1b1f; --text: #f3f3f5; --muted: #9b9ba5; --accent: #ff8a5c; --blue: #74b0f2; }
      body {
        margin: 0; padding: 28px; background: var(--bg); color: var(--text);
        font: 15px/1.45 ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      img { width: 52px; height: 52px; border-radius: 14px; }
      h1 { margin: 14px 0 4px; font-size: 24px; letter-spacing: -0.03em; }
      p { color: var(--muted); margin: 0 0 18px; }
      label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
      input {
        box-sizing: border-box; width: 100%; padding: 11px 12px; font: inherit; color: var(--text);
        border-radius: 12px; border: 1px solid #2c2c33; background: var(--surface);
      }
      input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
      button {
        width: 100%; padding: 12px; font: inherit; font-weight: 650; border: 0; cursor: pointer;
        border-radius: 999px; background: linear-gradient(180deg, #ffa071, var(--accent)); color: #1a0f0a;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: #ff7a7a; }
      .note { font-size: 12.5px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1>Connect to Demel</h1>
    <p>Sip reminders from your Demel server, full screen on every monitor.</p>

    <form id="f">
      <label>
        Demel address
        <input name="url" type="url" required placeholder="https://your-server.ts.net:10456" />
      </label>
      <label>
        Demel password
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button id="go">Connect</button>
      <div id="msg" role="alert"></div>
      <p class="note">
        The password is used once to create a key for this computer and is not stored. Reminder
        hours, sip size and your daily goal are set in Demel under Hydration schedule.
      </p>
    </form>

    <script>
      const { invoke } = window.__TAURI__.core;
      const f = document.getElementById("f");
      const msg = document.getElementById("msg");
      const go = document.getElementById("go");

      f.onsubmit = async (e) => {
        e.preventDefault();
        msg.textContent = "";
        go.disabled = true;
        try {
          await invoke("connect", { url: f.url.value, password: f.password.value });
        } catch (err) {
          msg.textContent = err;
          go.disabled = false;
        }
      };

      invoke("get_server").then((u) => {
        if (u) f.url.value = u;
        (u ? f.password : f.url).focus();
      });
    </script>
  </body>
</html>
